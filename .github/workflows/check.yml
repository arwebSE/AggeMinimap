name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build addon ZIP
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AggeMinimap
          path: dist/AggeMinimap-*.zip
          if-no-files-found: error
