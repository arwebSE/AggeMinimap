name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check syntax with the Lua 5.1 compiler
        run: luac5.1 -p AggeMinimap/AggeMinimap.lua tests/runtime.lua
      - name: Test normal minimap loading
        run: lua5.1 tests/runtime.lua
      - name: Test delayed minimap loading
        run: lua5.1 tests/runtime.lua delayed
      - name: Check manifests and textures
        run: python3 tests/check-inputs.py
      - name: Build addon ZIP
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AggeMinimap
          path: dist/AggeMinimap-*.zip
          if-no-files-found: error
  curseforge-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect duplicate branch build for a release tag
        id: release-tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release tag found at HEAD; the tag workflow verifies the package."
          fi
      - name: Build using CurseForge-compatible package metadata
        if: steps.release-tag.outputs.skip != 'true'
        uses: BigWigsMods/packager@v2.7.0
        with:
          args: -d -g 1.60.1
      - name: Verify installable layout and excluded development files
        if: steps.release-tag.outputs.skip != 'true'
        run: python3 scripts/check-package.py
      - name: Test release-tag validation
        run: python3 tests/check-release.py
      - uses: actions/upload-artifact@v7.0.2
        if: steps.release-tag.outputs.skip != 'true'
        with:
          name: AggeMinimap-CurseForge
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true
  publish-curseforge:
    name: Publish tagged release to CurseForge
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, curseforge-package]
    runs-on: ubuntu-latest
    concurrency:
      group: curseforge-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag matches both addon versions
        run: python3 scripts/check-release.py
      - name: Check publishing credential is configured
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Add the CF_API_TOKEN repository secret before publishing."
            exit 1
          fi
      - name: Upload Forever release to CurseForge
        uses: BigWigsMods/packager@v2.7.0
        with:
          args: -g 1.60.1 -p 1792808
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
