name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build addon ZIP
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AggeMinimap
          path: dist/AggeMinimap-*.zip
          if-no-files-found: error
  curseforge-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build using CurseForge-compatible package metadata
        uses: BigWigsMods/packager@v2.7.0
        with:
          args: -d -g 1.60.1
      - name: Verify installable layout and excluded development files
        run: python3 scripts/check-package.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AggeMinimap-CurseForge
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true
